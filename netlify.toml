[build]
  command = "vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify Functions
[functions]
  directory = "netlify/functions"

# API 端点 → 独立 Netlify Function
[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200
  force = true

[[redirects]]
  from = "/api/report"
  to = "/.netlify/functions/report"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/jwt"
  to = "/.netlify/functions/jwt"
  status = 200
  force = true

[[redirects]]
  from = "/api/analyze-async"
  to = "/.netlify/functions/analyze-async"
  status = 200
  force = true

[[redirects]]
  from = "/api/query-result"
  to = "/.netlify/functions/query-result"
  status = 200
  force = true

[[redirects]]
  from = "/api/analyze-stream"
  to = "/.netlify/functions/analyze-stream"
  status = 200
  force = true

# SPA 路由回退
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
